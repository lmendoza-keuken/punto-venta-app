name: punto_venta_app
description: A Flutter POS application with BLoC architecture
version: 1.0.29+29
publish_to: none

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  bloc: 9.2.1
  flutter_bloc: 9.1.1
  equatable: 2.0.7
  
  # Navigation
  go_router: 18.1.2
  
  # Dependency Injection
  get_it: 7.7.0
  
  # Storage
  shared_preferences: 2.5.6
  sqflite: 2.3.3+1
  path: ^1.9.0
  path_provider: 2.1.2
  
  # JSON Serialization
  json_annotation: 4.12.0

  # Freezed
  freezed_annotation: 3.1.0
  
  # HTTP requests
  http: 1.6.0

  dio: 5.11.1
  retrofit: 4.10.0
  
  # Date formatting
  intl: 0.20.3
  
  # UI
  cupertino_icons: 2.0.0
  font_awesome_flutter: 11.0.0
  uuid: 4.6.0
  flutter_svg: 2.1.0
  barcode: 2.2.6
  image: 4.2.0
  url_launcher: 6.3.3
  crypto: 3.0.8
  qr_flutter: 4.1.0

  
  # Firebase
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  firebase_storage: 14.0.1
  google_sign_in: 6.2.2
  package_info_plus: 10.2.2
  window_manager: 0.5.2
  desktop_multi_window: 0.3.1
  screen_retriever: 0.2.2
  # Vendored: pub 1.0.0 rompe AGP 8+ (namespace) y Flutter nuevo (Registrar v1).
  # El hack solo en android/build.gradle no alcanza (falta el fix de Kotlin).
  presentation_displays:
    path: packages/presentation_displays

  # Images
  cached_network_image: 3.3.1

 

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.17.1
  freezed: 4.0.3
  json_serializable: 6.15.2
  retrofit_generator: 10.3.3
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/mock/product_3_secco_naranja.jpg
    - assets/images/
